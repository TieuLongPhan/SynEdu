name: CI

on:
  push:
    branches: [main, talks]
    paths:
      - "synedu/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (black + flake8)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Check formatting (black)
        run: black --check synedu tests

      - name: Lint (flake8)
        run: flake8 synedu tests

  test:
    name: Fast tests (smoke + CLI)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests (excluding slow notebook execution)
        run: pytest -m "not slow" -v tests/
