name: CI

on:
  push:
    branches: [main, new]
    paths:
      - "synedu/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "myst.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Check formatting
        run: uv run black --check synedu/*.py synedu/Utils tests scripts

      - name: Lint
        run: uv run flake8 synedu tests scripts

  test:
    name: Fast tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -m "not slow" -v tests/

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Cache MyST execution cache
        uses: actions/cache@v4
        with:
          path: _build/execute
          key: myst-execute-${{ hashFiles('synedu/S*/notebook.md') }}
          restore-keys: myst-execute-

      - name: Export download/Colab notebooks
        run: uv run python scripts/prepare_jupyter_book.py

      - name: Build Jupyter Book
        run: uv run jupyter book build --execute --html --execute-parallel 1

      - name: Commit refreshed download notebooks
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh docs/downloads notebooks"
          file_pattern: docs/downloads/*.ipynb
