name: CI

on:
  push:
  pull_request:

jobs:
  test-and-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --extra dev --extra docs

      - name: Run tests
        run: uv run pytest -q

      - name: Build docs
        run: uv run ./build_doc.sh
