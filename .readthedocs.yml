version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
    nodejs: "22"
  jobs:
    create_environment:
      - python -m pip install uv
      - uv sync
    build:
      html:
        - uv run python scripts/prepare_jupyter_book.py
        - uv run jupyter book build --execute --html --execute-parallel 1
        - mkdir -p "$READTHEDOCS_OUTPUT/html"
        - cp -r _build/html/* "$READTHEDOCS_OUTPUT/html/"
