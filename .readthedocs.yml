version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
    nodejs: "22"
  commands:
    - python -m pip install "uv==0.11.21"
    - uv --version
    - node --version
    - uv sync --frozen
    - uv run python --version
    - uv run jupyter book build --execute --html --execute-parallel 1 --ci --output "$READTHEDOCS_OUTPUT/html"
    - test -f "$READTHEDOCS_OUTPUT/html/index.html"
    - make build-downloads DOWNLOAD_DIR="$READTHEDOCS_OUTPUT/html/downloads"
