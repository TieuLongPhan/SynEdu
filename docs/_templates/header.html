<header class="md-header" data-md-component="header">
  <a class="synedu-skip-link" href="#synedu-main">Skip to main content</a>
  <nav class="synedu-masthead md-grid" aria-label="Primary navigation">
    <div class="synedu-masthead__top">
      <div class="synedu-masthead__brand">
        <a href="{{ pathto(master_doc)|e }}" title="{{ docstitle|e }}"
           class="md-header-nav__button md-logo synedu-logo">
          {% if theme_logo_icon|e %}
            <i class="md-icon">{{ theme_logo_icon }}</i>
          {% elif logo %}
            <img src="{{ pathto('_static/' ~ logo, 1) }}" height="26"
                 alt="{{ shorttitle|striptags|e }} logo">
          {% else %}
            &nbsp;
          {% endif %}
        </a>
        <a class="synedu-masthead__title" href="{{ pathto(master_doc)|e }}">SynEdu</a>
        <label class="md-icon md-icon--menu md-header-nav__button synedu-masthead__menu"
               for="__drawer"
               aria-label="Open navigation"></label>
      </div>

      <div class="synedu-masthead__tools">
        <form class="synedu-search-form" action="{{ pathto('search') }}" method="get" role="search">
          <i class="md-icon" aria-hidden="true">search</i>
          <input type="text" name="q" placeholder="Search docs" aria-label="Search documentation">
        </form>
        <button class="synedu-header-icon synedu-theme-toggle" type="button" title="Toggle light or dark mode" aria-label="Toggle light or dark mode">
          <i class="md-icon">brightness_6</i>
        </button>
        <a class="synedu-header-icon" href="{{ theme_repo_url }}" title="GitHub" aria-label="GitHub">
          <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
            <use xlink:href="#__github" width="24" height="24"></use>
          </svg>
        </a>
        <a class="synedu-header-icon" href="https://github.com/TieuLongPhan/SynEdu/issues" title="Issues" aria-label="Issues">
          <i class="md-icon">bug_report</i>
        </a>
        <a class="synedu-header-icon synedu-header-icon--zenodo" href="https://doi.org/10.5281/zenodo.20315655" title="Zenodo DOI" aria-label="Zenodo DOI">
          <span aria-hidden="true">Z</span>
        </a>
        <a class="synedu-header-icon" href="mailto:tieu.long.phan@gmail.com" title="Contact by email" aria-label="Contact by email">
          <i class="md-icon">mail</i>
        </a>
        <a class="md-icon md-icon--search md-header-nav__button synedu-mobile-search"
           href="{{ pathto('search') }}"
           aria-label="Search"></a>
      </div>
    </div>

    <p class="synedu-masthead__tagline">
      Teaching reaction informatics via formal graph theory
    </p>

    <div class="synedu-masthead__nav">
      <a href="{{ pathto('installing') }}" class="{% if pagename == 'installing' %}is-active{% endif %}">Getting started</a>
      <a href="{{ pathto('talktorials/index') }}" class="{% if pagename.startswith('talktorials/') %}is-active{% endif %}">Talktorials</a>
      <a href="{{ pathto('contribute') }}" class="{% if pagename == 'contribute' %}is-active{% endif %}">Contribute</a>
      <a href="{{ pathto('citation') }}" class="{% if pagename == 'citation' %}is-active{% endif %}">Citation</a>
    </div>
  </nav>
</header>
