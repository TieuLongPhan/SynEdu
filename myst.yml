        - file: docs/talktorials/all_talktorials.md
        - title: S01 - From Molecules to Labeled Graphs
          file: synedu/S01/notebook.md
        - title: S02 - Graph Homomorphism in Reaction Informatics
          file: synedu/S02/notebook.md
        - title: S03 - Maximum Common Substructure in Reaction Informatics
          file: synedu/S03/notebook.md
        - title: "S04 - Atom Mapping as Graph Isomorphism: MCS, RXNMapper, and ITS Equivalence"
          file: synedu/S04/notebook.md
        - title: "S05 - Reaction Rules as Graph Rewriting (DPO) - Chemistry-First, ITS-Native"
          file: synedu/S05/notebook.md
        - title: "S06 - From Atom-Mapped Reactions to DPO Rules: ITS, Reaction Centers, and Fast Clustering"
          file: synedu/S06/notebook.md
        - title: "S07 - Canonicalizing Atom-Mapped Reactions and Rules: Equivalence, Symmetry, Determinism"
          file: synedu/S07/notebook.md
        - title: "S08 - One-Step Rule Application (Forward & Backward): DPO Rules as Reaction Engines"
          file: synedu/S08/notebook.md
        - title: "S09 - Metrics for Rule Application: Coverage, Recall, Branching, and Cost"
          file: synedu/S09/notebook.md
    - file: docs/api.md
    - file: docs/syneco_ecosystem.md
    - file: docs/external_dependencies.md
    - file: docs/external_tutorials_collections.md
    - file: docs/contribute.md
    - file: docs/contact.md
    - file: docs/funding.md
    - file: docs/citation.md
    - file: docs/license.md

