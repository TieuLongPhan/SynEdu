[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


# ---------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------
[project]
name = "synedu"
version = "0.1.0"
description = "Reproducible, graph-based chemical education via executable talktorials"
readme = "README.md"
requires-python = ">=3.11"

license = { text = "MIT" }
license-files = ["LICENSE"]

authors = [
  { name = "Tieu Long Phan", email = "tieu@bioinf.uni-leipzig.de" }
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Education",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# ---------------------------------------------------------------------
# Core runtime dependencies (keep minimal!)
# ---------------------------------------------------------------------
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "networkx>=3.3",
  "matplotlib>=3.8",
  "rdkit>=2023.9",
  "seaborn>=0.13.2",
  "regex>=2024.11.6",
  "requests>=2.32.3",
  "ipython>=8.18",
  "jupyterlab>=4.0",
  "sphinx>=8.2.3",
  "sphinx-material>=0.0.36",
  "nbsphinx>=0.9.8",
  "nbsphinx-link==1.3.1",
  "sphinx-copybutton>=0.5.2",
  "sphinx-gallery>=0.21.0",
]


# ---------------------------------------------------------------------
# Optional dependency groups
# ---------------------------------------------------------------------
[project.optional-dependencies]

# Default "developer" setup for contributors
dev = [
  # Formatting / linting
  "black==25.12.0",
  "flake8==7.3.0",
  "flake8-bugbear==25.11.29",
  "flake8-docstrings==1.7.0",

  # Testing
  "pytest>=8.0",
  "nbval>=0.11",

  # Notebook hygiene
  "nbformat>=5.9",
  "nbconvert>=7.16",

  # Convenience
  "pre-commit>=3.6",
]

# Documentation
docs = [
  "sphinx>=7.2,<9",
  "docutils>=0.20,<0.22",
  "sphinx-material",
  "nbsphinx",
  "nbsphinx-link==1.3.1",
  "sphinx-copybutton",
  "sphinx-gallery",
  "ipython>=8.18",
  "nbformat>=5.9",
  "nbconvert>=7.16",
  "myst-parser>=2.0",
  "pypandoc-binary>=1.14",
]


# ---------------------------------------------------------------------
# Entry points
# ---------------------------------------------------------------------
[project.scripts]
synedu = "synedu.cli:main"


# ---------------------------------------------------------------------
# Hatch build configuration
# ---------------------------------------------------------------------
[tool.hatch.build]
packages = ["synedu"]

[tool.hatch.build.targets.wheel]
include = [
  "synedu/**",
]

[tool.hatch.build.targets.sdist]
include = [
  "synedu/**",
  "tests/**",
  "README.md",
  "LICENSE",
]


# ---------------------------------------------------------------------
# Formatting (Black)
# ---------------------------------------------------------------------
[tool.black]
line-length = 88
target-version = ["py311"]
skip-string-normalization = true
extend-exclude = '''
(
  \.ipynb$
)
'''




# ---------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
]
markers = [
  "slow: notebook execution tests (run with -m slow or omit to skip)",
]


# ---------------------------------------------------------------------
# NBVAL (implicit via pytest --nbval-lax)
# ---------------------------------------------------------------------
# No extra config needed; invoked explicitly in CI or CLI
