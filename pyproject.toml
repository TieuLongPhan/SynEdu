[project]
name = "synedu"
version = "0.1.0"
description = "Reproducible, graph-based chemical education via executable talktorials"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [
  { name = "Tieu Long Phan", email = "tieu@bioinf.uni-leipzig.de" }
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "networkx>=3.3",
  "matplotlib>=3.8",
  "seaborn>=0.13.2",
  "regex>=2024.11.6",
  "requests>=2.32.3",
  "ipython>=8.18",
  "jupyter-book>=2.0.0",
]
