[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


# ---------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------
[project]
name = "synedu"
version = "0.1.0"
description = "Reproducible, graph-based chemical education via executable talktorials"
readme = "README.md"
requires-python = ">=3.11"

license = { text = "MIT" }
license-files = ["LICENSE"]

authors = [
  { name = "Tieu Long Phan", email = "tieu@bioinf.uni-leipzig.de" }
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Education",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# ---------------------------------------------------------------------
# Core runtime dependencies (keep minimal!)
# ---------------------------------------------------------------------
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "networkx>=3.3",
  "matplotlib>=3.8",
  "rdkit>=2023.9",
  "seaborn>=0.13.2",
  "regex>=2024.11.6",
  "requests>=2.32.3",
  "ipython>=8.18",
  "scikit-learn>=1.5",
  "synkit>=0.0.15",
  "synrbl>=0.1.0",
]


# ---------------------------------------------------------------------
# Entry points
# ---------------------------------------------------------------------
[project.scripts]
synedu = "synedu.cli:main"


[dependency-groups]
dev = [
  "black==25.12.0",
  "flake8==7.3.0",
  "flake8-bugbear==25.11.29",
  "flake8-docstrings==1.7.0",
  "pytest>=8.0",
  "nbval>=0.11",
  "nbformat>=5.9",
  "nbconvert>=7.16",
  "jupytext>=1.19.4",
  "pre-commit>=3.6",
]
docs = [
  "jupyter-book>=2",
  "jupyterlab>=4.0",
  "jupyter-server>=2",
  "ipykernel>=6.29",
  "nbformat>=5.9",
  "nbconvert>=7.16",
  "jupytext>=1.19.4",
]


[tool.uv]
default-groups = ["dev", "docs"]


# ---------------------------------------------------------------------
# Hatch build configuration
# ---------------------------------------------------------------------
[tool.hatch.build]
packages = ["synedu"]

[tool.hatch.build.targets.wheel]
include = [
  "synedu/**",
]

[tool.hatch.build.targets.sdist]
include = [
  "synedu/**",
  "tests/**",
  "docs/**",
  "scripts/**",
  "myst.yml",
  "README.md",
  "LICENSE",
]


# ---------------------------------------------------------------------
# Formatting (Black)
# ---------------------------------------------------------------------
[tool.black]
line-length = 88
target-version = ["py311"]
skip-string-normalization = true
extend-exclude = '''
(
  \.ipynb$
  | synedu/S[0-9][0-9]/notebook\.py$
)
'''
# ---------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
]
markers = [
  "slow: notebook execution tests (run with -m slow or omit to skip)",
]


# ---------------------------------------------------------------------
# NBVAL (implicit via pytest --nbval-lax)
# ---------------------------------------------------------------------
# No extra config needed; invoked explicitly in CI or CLI
